id = "stakpak"
name = "Stakpak"
version = "0.1.7"
schema_version = 1
authors = ["Stakpak Team <contact@stakpak.dev>"]
description = "Open-source DevOps agent in Rust with enterprise-grade security."
repository = "https://github.com/stakpak/zed-stakpak-agent-server"

[agent_servers.stakpak]
name = "Stakpak"
icon = "./icons/stakpak.svg"

# Environment variables (optional)
[agent_servers.stakpak.env]
# STAKPAK_API_KEY = "your-api-key"  # Optional: Add if you want to use the API key authentication

